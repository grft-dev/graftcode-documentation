<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">The Graftcode procedure: setup once, then call at runtime</title>
  <desc id="desc">Setup happens once: a provider module is analyzed so Gateway discovers its public surface, the package service generates a Graft, and the consumer installs it. At runtime, each consumer call is invoked on the provider through Gateway and a result or error returns.</desc>
  <style>
    text{font:15px system-ui,sans-serif;fill:#171317}
    .h{font-weight:700;font-size:15px}
    .small{font-size:12px;fill:#706A70}
    .cap{font-size:10.5px;font-weight:700;letter-spacing:.05em;fill:#39734A}
    .phase{font-size:12px;font-weight:700;letter-spacing:.06em;fill:#8A7E8A}
    .edge{font-size:11.5px;fill:#706A70}
    .card{fill:#ffffff;stroke:#E6E2E6;stroke-width:1.5}
    .flow{stroke:#171317;stroke-width:2.2;fill:none}
    .gen{stroke:#A8228D;stroke-width:2;fill:none;stroke-dasharray:6 5}
    .dist{stroke:#B7B2B7;stroke-width:2;fill:none;stroke-dasharray:4 4}
    .ret{stroke:#A8228D;stroke-width:2;fill:none;stroke-dasharray:6 5}
    .divider{stroke:#CBB9C6;stroke-width:2;stroke-dasharray:6 6}
    .gh{fill:#ffffff;font-weight:700;font-size:15px}
    .gsub{fill:#ffffff;opacity:.92;font-size:12px}
  </style>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DA1A60"/><stop offset="1" stop-color="#A8228D"/></linearGradient>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0l9 4.5-9 4.5z" fill="#171317"/></marker>
    <marker id="m" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0l9 4.5-9 4.5z" fill="#A8228D"/></marker>
    <marker id="d" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0l9 4.5-9 4.5z" fill="#B7B2B7"/></marker>
    <filter id="s" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#171317" flood-opacity="0.10"/></filter>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#A8228D" flood-opacity="0.28"/></filter>
  </defs>

  <rect x="8" y="8" width="1184" height="234" rx="20" fill="#FAF9FA"/>

  <text class="phase" x="480" y="42" text-anchor="middle">SETUP &#183; ONCE</text>
  <text class="phase" x="1080" y="42" text-anchor="middle">RUNTIME &#183; PER CALL</text>
  <line class="divider" x1="960" y1="60" x2="960" y2="196"/>

  <!-- 1 provider module -->
  <g filter="url(#s)"><rect class="card" x="32" y="78" width="176" height="88" rx="14"/></g>
  <rect x="32" y="78" width="6" height="88" rx="3" fill="#39734A"/>
  <text class="h" x="120" y="116" text-anchor="middle">Provider module</text>
  <text class="cap" x="120" y="140" text-anchor="middle">USER-WRITTEN</text>

  <!-- 2 discover -->
  <g filter="url(#s)"><rect class="card" x="272" y="78" width="176" height="88" rx="14"/></g>
  <text class="h" x="360" y="116" text-anchor="middle">Gateway discovers</text>
  <text class="small" x="360" y="138" text-anchor="middle">public surface</text>

  <!-- 3 generate (focal) -->
  <g filter="url(#g)"><rect x="512" y="78" width="176" height="88" rx="14" fill="url(#brand)"/></g>
  <text class="gh" x="600" y="116" text-anchor="middle">Package service</text>
  <text class="gsub" x="600" y="138" text-anchor="middle">generates a Graft</text>

  <!-- 4 install & call -->
  <g filter="url(#s)"><rect class="card" x="752" y="78" width="176" height="88" rx="14"/></g>
  <rect x="752" y="78" width="6" height="88" rx="3" fill="#39734A"/>
  <text class="h" x="840" y="110" text-anchor="middle">Consumer installs</text>
  <text class="h" x="840" y="130" text-anchor="middle">&amp; calls the Graft</text>
  <text class="cap" x="840" y="151" text-anchor="middle">USER-WRITTEN</text>

  <!-- 5 invoke -->
  <g filter="url(#s)"><rect class="card" x="992" y="78" width="176" height="88" rx="14"/></g>
  <text class="h" x="1080" y="116" text-anchor="middle">Gateway invokes</text>
  <text class="small" x="1080" y="138" text-anchor="middle">the provider</text>

  <path class="flow" marker-end="url(#a)" d="M208 122H272"/>
  <path class="gen" marker-end="url(#m)" d="M448 122H512"/>
  <path class="dist" marker-end="url(#d)" d="M688 122H752"/>
  <path class="flow" marker-end="url(#a)" d="M928 122H992"/>
  <path class="ret" marker-end="url(#m)" d="M1080 166v28H840v-28"/>

  <text class="edge" x="240" y="112" text-anchor="middle">analyze</text>
  <text class="edge" x="480" y="112" text-anchor="middle" fill="#A8228D">generate</text>
  <text class="edge" x="720" y="112" text-anchor="middle">install</text>
  <text class="edge" x="960" y="212" text-anchor="middle" fill="#A8228D">result or error</text>
</svg>
