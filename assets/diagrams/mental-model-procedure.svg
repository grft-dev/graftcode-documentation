<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">The Graftcode procedure: setup once, then call at runtime</title>
  <desc id="desc">Setup analyzes the Receiver, generates a Graft, and the Caller installs it; runtime invokes the Receiver through Gateway and returns a result or error.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#FFFFFF"/>
    </marker>
    <marker id="arrowMuted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#9BB0C4"/>
    </marker>
  </defs>
  <rect width="1200" height="250" fill="#0B1B2E"/>
  <style>
    .title { font: 700 22px Georgia, "Times New Roman", serif; fill: #FFFFFF; letter-spacing: 0.04em; }
    .h { font: 600 15px Consolas, "Courier New", monospace; fill: #FFFFFF; }
    .small { font: 12px Consolas, "Courier New", monospace; fill: #9BB0C4; }
    .cap { font: 700 11px Consolas, "Courier New", monospace; fill: #9BB0C4; letter-spacing: 0.08em; }
    .mono { font: 600 13px Consolas, "Courier New", monospace; fill: #FFFFFF; }
    .edge { font: 11px Consolas, "Courier New", monospace; fill: #9BB0C4; }
    .box { fill: none; stroke: #FFFFFF; stroke-width: 1.6; }
    .boxMuted { fill: none; stroke: #9BB0C4; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .flow { fill: none; stroke: #FFFFFF; stroke-width: 1.6; marker-end: url(#arrow); }
    .flowMuted { fill: none; stroke: #9BB0C4; stroke-width: 1.4; stroke-dasharray: 6 5; marker-end: url(#arrowMuted); }
    .track { fill: none; stroke: #9BB0C4; stroke-width: 2; }
  </style>
  
  <text class="title" x="600" y="34" text-anchor="middle">Setup once, then call at runtime</text>
  <text class="cap" x="470" y="58" text-anchor="middle">SETUP · ONCE</text>
  <text class="cap" x="1080" y="58" text-anchor="middle">RUNTIME · PER CALL</text>
  <line class="track" x1="940" y1="70" x2="940" y2="210"/>
  <rect class="box" x="32" y="84" width="176" height="88" rx="12"/><text class="h" x="120" y="118" text-anchor="middle">Receiver module</text><text class="cap" x="120" y="140" text-anchor="middle">USER-WRITTEN</text>
  <rect class="box" x="272" y="84" width="176" height="88" rx="12"/><text class="h" x="360" y="118" text-anchor="middle">Gateway discovers</text><text class="small" x="360" y="140" text-anchor="middle">public surface</text>
  <rect class="box" x="512" y="84" width="176" height="88" rx="12"/><text class="h" x="600" y="118" text-anchor="middle">Graftcode Engine</text><text class="small" x="600" y="140" text-anchor="middle">generates Graft</text>
  <rect class="box" x="752" y="84" width="176" height="88" rx="12"/><text class="h" x="840" y="112" text-anchor="middle">Caller installs</text><text class="h" x="840" y="132" text-anchor="middle">& calls Graft</text><text class="cap" x="840" y="152" text-anchor="middle">USER-WRITTEN</text>
  <rect class="box" x="992" y="84" width="176" height="88" rx="12"/><text class="h" x="1080" y="118" text-anchor="middle">Gateway invokes</text><text class="small" x="1080" y="140" text-anchor="middle">Receiver</text>
  <path class="flow" d="M208 126 H272"/><path class="flow" d="M448 126 H512"/><path class="flowMuted" d="M688 126 H752"/><path class="flow" d="M928 126 H992"/>
  <path class="flowMuted" d="M1080 172 V200 H840 V172"/>
  <text class="edge" x="240" y="116">analyze</text><text class="edge" x="480" y="116">generate</text><text class="edge" x="720" y="116">install</text><text class="edge" x="960" y="224">result or error</text>

</svg>
