<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 380" role="img" aria-labelledby="title desc">
  <title id="title">Graftcode security boundaries</title>
  <desc id="desc">The Caller and its Graft run in the Caller environment. Runtime calls travel over TLS/WSS, which is terminated at reviewed ingress or reverse-proxy infrastructure; the hop from there to Gateway may be a separate configured hop. Gateway and Receiver business logic run in the Receiver environment, where invocation authentication and authorization are enforced. The registry (install time) and Graftcode Engine (setup time) are control-plane services reached over separate metadata and package flows, not the runtime data path.</desc>
  <style>
    text{font:15px system-ui,sans-serif;fill:#171317}
    .h{font-weight:700;font-size:15px}
    .small{font-size:12px;fill:#706A70}
    .zone{font-size:11px;font-weight:700;letter-spacing:.05em;fill:#8A7E8A}
    .card{fill:#ffffff;stroke:#E6E2E6;stroke-width:1.5}
    .env{fill:none;stroke:#B7B2B7;stroke-width:1.5;stroke-dasharray:5 4}
    .flow{stroke:#171317;stroke-width:2.2;fill:none}
    .meta{stroke:#A8228D;stroke-width:2;fill:none;stroke-dasharray:6 5}
    .gh{fill:#ffffff;font-weight:700;font-size:15px}
    .gsub{fill:#ffffff;opacity:.92;font-size:12px}
    .edge{font-size:11.5px;fill:#706A70}
  </style>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DA1A60"/><stop offset="1" stop-color="#A8228D"/></linearGradient>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0l9 4.5-9 4.5z" fill="#171317"/></marker>
    <marker id="m" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0l9 4.5-9 4.5z" fill="#A8228D"/></marker>
    <filter id="s" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#171317" flood-opacity="0.10"/></filter>
    <filter id="g" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#A8228D" flood-opacity="0.26"/></filter>
  </defs>

  <rect x="8" y="8" width="1064" height="364" rx="20" fill="#FAF9FA"/>

  <!-- Caller environment -->
  <rect class="env" x="28" y="70" width="270" height="150" rx="14"/>
  <text class="zone" x="44" y="92">CALLER ENVIRONMENT</text>
  <g filter="url(#s)"><rect class="card" x="48" y="104" width="230" height="46" rx="10"/></g><text class="h" x="163" y="132" text-anchor="middle">Caller application</text>
  <g filter="url(#s)"><rect class="card" x="48" y="158" width="230" height="52" rx="10"/></g><text class="h" x="163" y="182" text-anchor="middle">Graft + Hypertube</text><text class="small" x="163" y="200" text-anchor="middle">holds invocation credentials</text>

  <!-- Ingress / proxy -->
  <g filter="url(#s)"><rect class="card" x="360" y="118" width="150" height="82" rx="12"/></g>
  <text class="h" x="435" y="150" text-anchor="middle">Ingress /</text><text class="h" x="435" y="168" text-anchor="middle">reverse proxy</text><text class="small" x="435" y="188" text-anchor="middle">TLS terminates here</text>

  <!-- Receiver environment -->
  <rect class="env" x="560" y="70" width="290" height="150" rx="14"/>
  <text class="zone" x="576" y="92">RECEIVER ENVIRONMENT</text>
  <g filter="url(#g)"><rect x="580" y="104" width="250" height="46" rx="10" fill="url(#brand)"/></g><text class="gh" x="705" y="126" text-anchor="middle">Gateway (gg)</text><text class="gsub" x="705" y="142" text-anchor="middle">validates callable surface + authz</text>
  <g filter="url(#s)"><rect class="card" x="580" y="158" width="250" height="52" rx="10"/></g><text class="h" x="705" y="182" text-anchor="middle">Receiver business logic</text><text class="small" x="705" y="200" text-anchor="middle">enforces authorization; stays private</text>

  <path class="flow" marker-end="url(#a)" d="M278 174 H360"/>
  <path class="flow" marker-end="url(#a)" d="M510 159 H580"/>
  <text class="edge" x="319" y="164" text-anchor="middle">TLS / WSS</text>
  <text class="edge" x="545" y="149" text-anchor="middle">configured hop</text>

  <!-- Control plane -->
  <text class="zone" x="44" y="266">CONTROL PLANE (not the runtime data path)</text>
  <g filter="url(#s)"><rect class="card" x="48" y="278" width="250" height="60" rx="12"/></g>
  <text class="h" x="173" y="304" text-anchor="middle">Registry</text><text class="small" x="173" y="324" text-anchor="middle">install-time package download</text>
  <g filter="url(#s)"><rect class="card" x="580" y="278" width="250" height="60" rx="12"/></g>
  <text class="h" x="705" y="304" text-anchor="middle">Graftcode Engine</text><text class="small" x="705" y="324" text-anchor="middle">setup-time public interface metadata</text>

  <path class="meta" marker-end="url(#m)" d="M163 210 V278"/>
  <path class="meta" marker-end="url(#m)" d="M705 210 V278"/>
  <text class="edge" x="705" y="250" text-anchor="middle" fill="#A8228D">public interface metadata only</text>
</svg>
