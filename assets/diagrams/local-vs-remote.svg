<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 350" role="img" aria-labelledby="title desc">
  <title id="title">One Graft, three execution modes selected by configuration</title>
  <desc id="desc">The same generated Graft and call site resolve to in-memory, same-machine, or remote execution depending on the host configuration. In-memory uses no network boundary; localhost WebSocket or TCP is still network transport across a process boundary; remote adds latency, authentication, routing, and partial-failure concerns.</desc>
  <style>
    text{font:16px system-ui,sans-serif;fill:#171317}
    .h{font-weight:700;font-size:16px}
    .small{font-size:12.5px;fill:#706A70}
    .mono{font-family:'Courier New',monospace;font-size:13px;fill:#171317;font-weight:700}
    .card{fill:#ffffff;stroke:#E6E2E6;stroke-width:1.5}
    .chip{fill:#F5F4F5;stroke:#E6E2E6;stroke-width:1.5}
    .flow{stroke:#171317;stroke-width:2.2;fill:none}
    .gh{fill:#ffffff;font-weight:700;font-size:18px}
    .gsub{fill:#ffffff;opacity:.92;font-size:13px}
    .dot{}
  </style>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DA1A60"/><stop offset="1" stop-color="#A8228D"/></linearGradient>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0l9 4.5-9 4.5z" fill="#171317"/></marker>
    <filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#171317" flood-opacity="0.10"/></filter>
    <filter id="g" x="-30%" y="-40%" width="160%" height="200%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#A8228D" flood-opacity="0.28"/></filter>
  </defs>

  <rect x="8" y="8" width="1024" height="334" rx="20" fill="#FAF9FA"/>

  <!-- invariant top band (focal) -->
  <g filter="url(#g)"><rect x="40" y="52" width="960" height="72" rx="16" fill="url(#brand)"/></g>
  <text class="gh" x="520" y="86" text-anchor="middle">Same generated Graft — one call site</text>
  <text class="gsub" x="520" y="110" text-anchor="middle">the resolved <tspan font-family="'Courier New',monospace">host</tspan> configuration selects the path — your code does not change</text>

  <path class="flow" marker-end="url(#a)" d="M520 124 C 520 150, 188 150, 188 176"/>
  <path class="flow" marker-end="url(#a)" d="M520 124 V 176"/>
  <path class="flow" marker-end="url(#a)" d="M520 124 C 520 150, 852 150, 852 176"/>

  <!-- Column A: In memory -->
  <g filter="url(#s)"><rect class="card" x="40" y="176" width="296" height="140" rx="14"/></g>
  <circle cx="66" cy="204" r="6" fill="#39734A"/><text class="h" x="82" y="209">In memory</text>
  <rect class="chip" x="60" y="222" width="256" height="30" rx="8"/><text class="mono" x="76" y="242">host = inmemory</text>
  <text class="small" x="60" y="276">same process · direct dispatch</text>
  <text class="small" x="60" y="298">still builds and serializes commands</text>

  <!-- Column B: Same machine -->
  <g filter="url(#s)"><rect class="card" x="372" y="176" width="296" height="140" rx="14"/></g>
  <circle cx="398" cy="204" r="6" fill="#52627A"/><text class="h" x="414" y="209">Same machine</text>
  <rect class="chip" x="392" y="222" width="256" height="30" rx="8"/><text class="mono" x="408" y="242">ws://localhost · tcp://localhost:port</text>
  <text class="small" x="392" y="276">separate process · network transport</text>
  <text class="small" x="392" y="298">localhost is still WS/TCP, not in-memory</text>

  <!-- Column C: Remote -->
  <g filter="url(#s)"><rect class="card" x="704" y="176" width="296" height="140" rx="14"/></g>
  <circle cx="730" cy="204" r="6" fill="#A8228D"/><text class="h" x="746" y="209">Remote</text>
  <rect class="chip" x="724" y="222" width="256" height="30" rx="8"/><text class="mono" x="740" y="242">wss://host · tcp://host:port · …h2</text>
  <text class="small" x="724" y="276">another machine or service</text>
  <text class="small" x="724" y="298">adds latency, auth, routing, partial failure</text>

  <text class="h" x="520" y="40" text-anchor="middle" font-size="19">One package. Change host configuration, not your code.</text>
</svg>
