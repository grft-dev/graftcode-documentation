<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-labelledby="title desc">
  <title id="title">Generated and user-written boundaries</title>
  <desc id="desc">User-written producer code is analyzed into a generated Graft package, which is imported by user-written Caller code. Deployment configuration is also user-controlled.</desc>
  <style>
    text{font:16px system-ui,sans-serif;fill:#171317}
    .h{font-weight:700}
    .small{font-size:13px;fill:#706A70}
    .cap{font-size:11px;font-weight:700;letter-spacing:.04em;fill:#39734A}
    .card{fill:#ffffff;stroke:#E6E2E6;stroke-width:1.5}
    .flow{stroke:#171317;stroke-width:2.2;fill:none}
    .opt{stroke:#B7B2B7;stroke-width:2;fill:none;stroke-dasharray:4 4}
    .gh{fill:#ffffff;font-weight:700}
    .gsub{fill:#ffffff;opacity:.92;font-size:13px}
  </style>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DA1A60"/><stop offset="1" stop-color="#A8228D"/></linearGradient>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0l9 4.5-9 4.5z" fill="#171317"/></marker>
    <marker id="o" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0l9 4.5-9 4.5z" fill="#B7B2B7"/></marker>
    <filter id="s" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#171317" flood-opacity="0.10"/></filter>
    <filter id="g" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#A8228D" flood-opacity="0.28"/></filter>
  </defs>

  <rect x="8" y="8" width="744" height="254" rx="20" fill="#FAF9FA"/>

  <g filter="url(#s)"><rect class="card" x="36" y="56" width="200" height="90" rx="14"/></g>
  <rect x="36" y="56" width="6" height="90" rx="3" fill="#39734A"/>
  <text class="h" x="140" y="92" text-anchor="middle">Producer module</text>
  <text class="cap" x="140" y="118" text-anchor="middle">USER-WRITTEN</text>

  <g filter="url(#g)"><rect x="280" y="56" width="200" height="90" rx="14" fill="url(#brand)"/></g>
  <text class="gh" x="380" y="88" text-anchor="middle">Graft package</text>
  <text class="gsub" x="380" y="110" text-anchor="middle">wrappers + GraftConfig</text>
  <text class="gsub" x="380" y="129" text-anchor="middle">generated from the callable surface</text>

  <g filter="url(#s)"><rect class="card" x="524" y="56" width="200" height="90" rx="14"/></g>
  <rect x="524" y="56" width="6" height="90" rx="3" fill="#39734A"/>
  <text class="h" x="628" y="92" text-anchor="middle">Caller app</text>
  <text class="cap" x="628" y="118" text-anchor="middle">USER-WRITTEN</text>

  <path class="flow" marker-end="url(#a)" d="M236 101h44M480 101h44"/>

  <g filter="url(#s)"><rect class="card" x="280" y="184" width="200" height="60" rx="14"/></g>
  <rect x="280" y="184" width="6" height="60" rx="3" fill="#39734A"/>
  <text class="h" x="384" y="210" text-anchor="middle">Deployment config</text>
  <text class="small" x="384" y="230" text-anchor="middle">user-controlled</text>
  <path class="opt" marker-end="url(#o)" d="M380 184v-38"/>
</svg>
