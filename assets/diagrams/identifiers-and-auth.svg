<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" role="img" aria-labelledby="title desc">
  <title id="title">Project Key, registry URL, runtime host, and call credential are four different things</title>
  <desc id="desc">Project Key registers the Gateway in a project at startup. The registry URL is used by the consumer package manager to install the Graft. The runtime host, set on GraftConfig, executes methods. The call credential, passed as a header or parameter, authorizes a specific call.</desc>
  <style>
    text{font:16px system-ui,sans-serif;fill:#171317}
    .h{font-weight:700;font-size:16px}
    .small{font-size:12.5px;fill:#706A70}
    .mono{font-family:'Courier New',monospace;font-size:12.5px;fill:#171317}
    .lbl{font-size:11px;font-weight:700;letter-spacing:.05em;fill:#8A7E8A}
    .card{fill:#ffffff;stroke:#E6E2E6;stroke-width:1.5}
    .bandText{fill:#ffffff;font-weight:700;font-size:18px}
  </style>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DA1A60"/><stop offset="1" stop-color="#A8228D"/></linearGradient>
    <filter id="s" x="-25%" y="-20%" width="150%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#171317" flood-opacity="0.10"/></filter>
    <filter id="g" x="-20%" y="-40%" width="140%" height="200%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#A8228D" flood-opacity="0.26"/></filter>
  </defs>

  <rect x="8" y="8" width="1024" height="284" rx="20" fill="#FAF9FA"/>

  <g filter="url(#g)"><rect x="32" y="40" width="976" height="52" rx="14" fill="url(#brand)"/></g>
  <text class="bandText" x="520" y="72" text-anchor="middle">Four different things &#8212; do not conflate them</text>

  <!-- 1 Project Key -->
  <g filter="url(#s)"><rect class="card" x="32" y="112" width="226" height="150" rx="14"/></g>
  <circle cx="56" cy="140" r="6" fill="#A8228D"/><text class="h" x="72" y="145">Project Key</text>
  <text class="lbl" x="52" y="176">SET ON</text>
  <text class="small" x="52" y="194">Gateway startup</text>
  <text class="mono" x="52" y="212">--projectKey</text>
  <text class="lbl" x="52" y="238">PURPOSE</text>
  <text class="small" x="52" y="256">Registers Gateway in a project</text>

  <!-- 2 Registry URL -->
  <g filter="url(#s)"><rect class="card" x="282" y="112" width="226" height="150" rx="14"/></g>
  <circle cx="306" cy="140" r="6" fill="#2764A8"/><text class="h" x="322" y="145">Registry URL</text>
  <text class="lbl" x="302" y="176">USED BY</text>
  <text class="small" x="302" y="194">Consumer package manager</text>
  <text class="mono" x="302" y="212">https://grft.dev</text>
  <text class="lbl" x="302" y="238">PURPOSE</text>
  <text class="small" x="302" y="256">Installs the Graft</text>

  <!-- 3 Runtime host -->
  <g filter="url(#s)"><rect class="card" x="532" y="112" width="226" height="150" rx="14"/></g>
  <circle cx="556" cy="140" r="6" fill="#39734A"/><text class="h" x="572" y="145">Runtime host</text>
  <text class="lbl" x="552" y="176">SET ON</text>
  <text class="small" x="552" y="194">GraftConfig host</text>
  <text class="mono" x="552" y="212">ws://host/ws · inmemory</text>
  <text class="lbl" x="552" y="238">PURPOSE</text>
  <text class="small" x="552" y="256">Executes the methods</text>

  <!-- 4 Call credential -->
  <g filter="url(#s)"><rect class="card" x="782" y="112" width="226" height="150" rx="14"/></g>
  <circle cx="806" cy="140" r="6" fill="#8A641F"/><text class="h" x="822" y="145">Call credential</text>
  <text class="lbl" x="802" y="176">SET ON</text>
  <text class="small" x="802" y="194">Header or parameter</text>
  <text class="mono" x="802" y="212">Authorization: Bearer</text>
  <text class="lbl" x="802" y="238">PURPOSE</text>
  <text class="small" x="802" y="256">Authorizes a specific call</text>
</svg>
