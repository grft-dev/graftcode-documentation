<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" role="img" aria-labelledby="title desc">
  <title id="title">Project Key, registry URL, runtime host, and call credential are four different things</title>
  <desc id="desc">Project Key registers Gateway; registry URL installs the Graft; runtime host executes methods; call credential authorizes a specific call.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#FFFFFF"/>
    </marker>
    <marker id="arrowMuted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#9BB0C4"/>
    </marker>
  </defs>
  <rect width="1040" height="300" fill="#0B1B2E"/>
  <style>
    .title { font: 700 22px Georgia, "Times New Roman", serif; fill: #FFFFFF; letter-spacing: 0.04em; }
    .h { font: 600 15px Consolas, "Courier New", monospace; fill: #FFFFFF; }
    .small { font: 12px Consolas, "Courier New", monospace; fill: #9BB0C4; }
    .cap { font: 700 11px Consolas, "Courier New", monospace; fill: #9BB0C4; letter-spacing: 0.08em; }
    .mono { font: 600 13px Consolas, "Courier New", monospace; fill: #FFFFFF; }
    .edge { font: 11px Consolas, "Courier New", monospace; fill: #9BB0C4; }
    .box { fill: none; stroke: #FFFFFF; stroke-width: 1.6; }
    .boxMuted { fill: none; stroke: #9BB0C4; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .flow { fill: none; stroke: #FFFFFF; stroke-width: 1.6; marker-end: url(#arrow); }
    .flowMuted { fill: none; stroke: #9BB0C4; stroke-width: 1.4; stroke-dasharray: 6 5; marker-end: url(#arrowMuted); }
    .track { fill: none; stroke: #9BB0C4; stroke-width: 2; }
  </style>
  <text class="title" x="520" y="34" text-anchor="middle">Four different things — do not conflate them</text>
  <rect class="box" x="32" y="72" width="226" height="150" rx="12"/>
  <text class="h" x="48" y="100" text-anchor="start">Project Key</text>
  <text class="cap" x="48" y="124" text-anchor="start">SET ON / USED BY</text>
  <text class="small" x="48" y="142" text-anchor="start">Gateway startup</text>
  <text class="mono" x="48" y="162" text-anchor="start">--projectKey</text>
  <text class="cap" x="48" y="186" text-anchor="start">PURPOSE</text>
  <text class="small" x="48" y="204" text-anchor="start">Registers Gateway in a project</text>
  <rect class="box" x="282" y="72" width="226" height="150" rx="12"/>
  <text class="h" x="298" y="100" text-anchor="start">Registry URL</text>
  <text class="cap" x="298" y="124" text-anchor="start">SET ON / USED BY</text>
  <text class="small" x="298" y="142" text-anchor="start">Caller package manager</text>
  <text class="mono" x="298" y="162" text-anchor="start">https://grft.dev</text>
  <text class="cap" x="298" y="186" text-anchor="start">PURPOSE</text>
  <text class="small" x="298" y="204" text-anchor="start">Installs the Graft</text>
  <rect class="box" x="532" y="72" width="226" height="150" rx="12"/>
  <text class="h" x="548" y="100" text-anchor="start">Runtime host</text>
  <text class="cap" x="548" y="124" text-anchor="start">SET ON / USED BY</text>
  <text class="small" x="548" y="142" text-anchor="start">GraftConfig.host</text>
  <text class="mono" x="548" y="162" text-anchor="start">ws://host/ws · inmemory</text>
  <text class="cap" x="548" y="186" text-anchor="start">PURPOSE</text>
  <text class="small" x="548" y="204" text-anchor="start">Executes methods</text>
  <rect class="box" x="782" y="72" width="226" height="150" rx="12"/>
  <text class="h" x="798" y="100" text-anchor="start">Call credential</text>
  <text class="cap" x="798" y="124" text-anchor="start">SET ON / USED BY</text>
  <text class="small" x="798" y="142" text-anchor="start">Header or parameter</text>
  <text class="mono" x="798" y="162" text-anchor="start">Authorization: Bearer</text>
  <text class="cap" x="798" y="186" text-anchor="start">PURPOSE</text>
  <text class="small" x="798" y="204" text-anchor="start">Authorizes one call</text>
</svg>
