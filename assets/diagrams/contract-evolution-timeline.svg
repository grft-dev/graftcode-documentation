<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 290" role="img" aria-labelledby="title desc">
  <title id="title">Safe contract-evolution workflow</title>
  <desc id="desc">Seven stages from changing the Receiver surface through publish, with old versions kept side by side while Callers migrate.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#FFFFFF"/>
    </marker>
    <marker id="arrowMuted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#9BB0C4"/>
    </marker>
  </defs>
  <rect width="1060" height="290" fill="#0B1B2E"/>
  <style>
    .title { font: 700 22px Georgia, "Times New Roman", serif; fill: #FFFFFF; letter-spacing: 0.04em; }
    .h { font: 600 15px Consolas, "Courier New", monospace; fill: #FFFFFF; }
    .small { font: 12px Consolas, "Courier New", monospace; fill: #9BB0C4; }
    .cap { font: 700 11px Consolas, "Courier New", monospace; fill: #9BB0C4; letter-spacing: 0.08em; }
    .mono { font: 600 13px Consolas, "Courier New", monospace; fill: #FFFFFF; }
    .edge { font: 11px Consolas, "Courier New", monospace; fill: #9BB0C4; }
    .box { fill: none; stroke: #FFFFFF; stroke-width: 1.6; }
    .boxMuted { fill: none; stroke: #9BB0C4; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .flow { fill: none; stroke: #FFFFFF; stroke-width: 1.6; marker-end: url(#arrow); }
    .flowMuted { fill: none; stroke: #9BB0C4; stroke-width: 1.4; stroke-dasharray: 6 5; marker-end: url(#arrowMuted); }
    .track { fill: none; stroke: #9BB0C4; stroke-width: 2; }
  </style>
  <text class="title" x="530" y="34" text-anchor="middle">Safe contract evolution</text>
  <line class="track" x1="80" y1="150" x2="980" y2="150"/>
  <circle class="box" cx="80" cy="150" r="16"/>
  <text class="mono" x="80" y="155" text-anchor="middle">1</text>
  <text class="h" x="80" y="94" text-anchor="middle">Change</text>
  <text class="small" x="80" y="112" text-anchor="middle">Receiver surface</text>
  <circle class="box" cx="230" cy="150" r="16"/>
  <text class="mono" x="230" y="155" text-anchor="middle">2</text>
  <text class="h" x="230" y="196" text-anchor="middle">Analyze</text>
  <text class="small" x="230" y="214" text-anchor="middle">public API</text>
  <circle class="box" cx="380" cy="150" r="16"/>
  <text class="mono" x="380" y="155" text-anchor="middle">3</text>
  <text class="h" x="380" y="94" text-anchor="middle">Generate</text>
  <text class="small" x="380" y="112" text-anchor="middle">packages</text>
  <circle class="box" cx="530" cy="150" r="16"/>
  <text class="mono" x="530" y="155" text-anchor="middle">4</text>
  <text class="h" x="530" y="196" text-anchor="middle">Compile</text>
  <text class="small" x="530" y="214" text-anchor="middle">Callers</text>
  <circle class="box" cx="680" cy="150" r="16"/>
  <text class="mono" x="680" y="155" text-anchor="middle">5</text>
  <text class="h" x="680" y="94" text-anchor="middle">Smoke test</text>
  <text class="small" x="680" y="112" text-anchor="middle">in-memory + remote</text>
  <circle class="box" cx="830" cy="150" r="16"/>
  <text class="mono" x="830" y="155" text-anchor="middle">6</text>
  <text class="h" x="830" y="196" text-anchor="middle">Publish</text>
  <text class="small" x="830" y="214" text-anchor="middle">new version</text>
  <circle class="box" cx="980" cy="150" r="16"/>
  <text class="mono" x="980" y="155" text-anchor="middle">7</text>
  <text class="h" x="980" y="94" text-anchor="middle">Keep old</text>
  <text class="small" x="980" y="112" text-anchor="middle">side by side</text>
  <text class="small" x="530" y="262" text-anchor="middle">Additive changes are usually safe; renames and signature changes are usually breaking.</text>
</svg>
