<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 290" role="img" aria-labelledby="title desc">
  <title id="title">Safe contract-evolution workflow</title>
  <desc id="desc">A safe change to a Graft contract moves through seven stages: change the Receiver surface, compare the generated public API, generate packages, compile Callers, run smoke tests, publish a new version, and keep the old version side by side while old Callers depend on it.</desc>
  <style>
    text{font:15px system-ui,sans-serif;fill:#171317}
    .h{font-weight:700;font-size:15px}
    .small{font-size:12px;fill:#706A70}
    .track{stroke:#E6E2E6;stroke-width:6;fill:none}
    .dot{fill:#ffffff;stroke:#B7B2B7;stroke-width:3}
    .num{fill:#171317;font-weight:700;font-size:13px}
    .numPub{fill:#ffffff;font-weight:700;font-size:14px}
  </style>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DA1A60"/><stop offset="1" stop-color="#A8228D"/></linearGradient>
    <filter id="g" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#A8228D" flood-opacity="0.35"/></filter>
  </defs>

  <rect x="8" y="8" width="1044" height="274" rx="20" fill="#FAF9FA"/>

  <text class="h" x="530" y="44" text-anchor="middle" font-size="19">Change the contract deliberately — verify before you publish</text>

  <line class="track" x1="80" y1="150" x2="980" y2="150"/>

  <circle class="dot" cx="80" cy="150" r="16"/><text class="num" x="80" y="155" text-anchor="middle">1</text>
  <text class="h" x="80" y="94" text-anchor="middle">Change</text><text class="small" x="80" y="112" text-anchor="middle">Receiver surface</text>

  <circle class="dot" cx="230" cy="150" r="16"/><text class="num" x="230" y="155" text-anchor="middle">2</text>
  <text class="h" x="230" y="196" text-anchor="middle">Analyze</text><text class="small" x="230" y="214" text-anchor="middle">the public API</text>

  <circle class="dot" cx="380" cy="150" r="16"/><text class="num" x="380" y="155" text-anchor="middle">3</text>
  <text class="h" x="380" y="94" text-anchor="middle">Generate</text><text class="small" x="380" y="112" text-anchor="middle">packages</text>

  <circle class="dot" cx="530" cy="150" r="16"/><text class="num" x="530" y="155" text-anchor="middle">4</text>
  <text class="h" x="530" y="196" text-anchor="middle">Compile</text><text class="small" x="530" y="214" text-anchor="middle">Callers</text>

  <circle class="dot" cx="680" cy="150" r="16"/><text class="num" x="680" y="155" text-anchor="middle">5</text>
  <text class="h" x="680" y="94" text-anchor="middle">Smoke test</text><text class="small" x="680" y="112" text-anchor="middle">in-memory + remote</text>

  <g filter="url(#g)"><circle cx="830" cy="150" r="19" fill="url(#brand)"/></g><text class="numPub" x="830" y="155" text-anchor="middle">6</text>
  <text class="h" x="830" y="196" text-anchor="middle">Publish</text><text class="small" x="830" y="214" text-anchor="middle">new version</text>

  <circle class="dot" cx="980" cy="150" r="16"/><text class="num" x="980" y="155" text-anchor="middle">7</text>
  <text class="h" x="980" y="94" text-anchor="middle">Keep old</text><text class="small" x="980" y="112" text-anchor="middle">side by side</text>

  <text class="small" x="530" y="262" text-anchor="middle">Additive changes are usually safe; renames, signature, return-type, and static/instance changes are usually breaking.</text>
</svg>
