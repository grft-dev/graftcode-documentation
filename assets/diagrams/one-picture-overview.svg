<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" role="img" aria-labelledby="title desc">
  <title id="title">Graftcode one-picture overview</title>
  <desc id="desc">A user-written module is analyzed into a callable-surface metadata, which generates a Graft package. A user-written Caller calls the Graft, whose configuration selects in-memory or Gateway-hosted execution.</desc>
  <style>
    text{font:16px system-ui,sans-serif;fill:#171317}
    .h{font-weight:700}
    .small{font-size:13px;fill:#706A70}
    .cap{font-size:11px;font-weight:700;letter-spacing:.04em;fill:#39734A}
    .card{fill:#ffffff;stroke:#E6E2E6;stroke-width:1.5}
    .flow{stroke:#171317;stroke-width:2.2;fill:none}
    .gh{fill:#ffffff;font-weight:700}
    .gsub{fill:#ffffff;opacity:.92;font-size:13px}
  </style>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DA1A60"/><stop offset="1" stop-color="#A8228D"/></linearGradient>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0l9 4.5-9 4.5z" fill="#171317"/></marker>
    <filter id="s" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#171317" flood-opacity="0.10"/></filter>
    <filter id="g" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#A8228D" flood-opacity="0.28"/></filter>
  </defs>

  <rect x="8" y="8" width="764" height="304" rx="20" fill="#FAF9FA"/>

  <g filter="url(#s)"><rect class="card" x="30" y="56" width="150" height="76" rx="14"/></g>
  <rect x="30" y="56" width="6" height="76" rx="3" fill="#39734A"/>
  <text class="h" x="108" y="90" text-anchor="middle">Module</text>
  <text class="cap" x="108" y="114" text-anchor="middle">USER-WRITTEN</text>

  <g filter="url(#s)"><rect class="card" x="212" y="56" width="120" height="76" rx="14"/></g>
  <text class="h" x="272" y="90" text-anchor="middle">Callable surface</text>
  <text class="small" x="272" y="112" text-anchor="middle">analyzed model</text>

  <g filter="url(#g)"><rect x="364" y="56" width="160" height="76" rx="14" fill="url(#brand)"/></g>
  <text class="gh" x="444" y="90" text-anchor="middle">Graft package</text>
  <text class="gsub" x="444" y="112" text-anchor="middle">generated</text>

  <g filter="url(#s)"><rect class="card" x="560" y="56" width="160" height="76" rx="14"/></g>
  <rect x="560" y="56" width="6" height="76" rx="3" fill="#39734A"/>
  <text class="h" x="644" y="90" text-anchor="middle">Caller</text>
  <text class="cap" x="644" y="114" text-anchor="middle">USER-WRITTEN</text>

  <path class="flow" marker-end="url(#a)" d="M180 94h32M332 94h32M524 94h36"/>

  <g filter="url(#s)"><rect class="card" x="364" y="182" width="160" height="70" rx="14"/></g>
  <text class="h" x="444" y="212" text-anchor="middle">Configuration</text>
  <text class="small" x="444" y="234" text-anchor="middle">in-memory or remote</text>
  <path class="flow" marker-end="url(#a)" d="M444 132v50"/>

  <g filter="url(#s)"><rect class="card" x="150" y="270" width="200" height="44" rx="12"/></g>
  <text x="250" y="297" text-anchor="middle">In-memory execution</text>
  <g filter="url(#s)"><rect class="card" x="500" y="270" width="210" height="44" rx="12"/></g>
  <text x="605" y="297" text-anchor="middle">Remote (Gateway-hosted)</text>
  <path class="flow" marker-end="url(#a)" d="M420 252l-130 18M470 252l60 12"/>
  <text class="small" x="330" y="262" text-anchor="middle">inmemory</text>
  <text class="small" x="536" y="258" text-anchor="middle">ws / wss</text>
</svg>
