<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="title desc">
  <title id="title">GraftConfig configuration precedence</title>
  <desc id="desc">The generated GraftConfig resolves configuration from six sources. Lower levels are checked first and win: runtime-specific environment variable, global environment variable, runtime-specific file, global file, user configuration, then the generated library default.</desc>
  <style>
    text{font:16px system-ui,sans-serif;fill:#171317}
    .h{font-weight:700;font-size:16px}
    .small{font-size:12.5px;fill:#706A70}
    .mono{font-family:'Courier New',monospace;font-size:12.5px;fill:#706A70}
    .row{fill:#ffffff;stroke:#E6E2E6;stroke-width:1.5}
    .cap{font-size:12px;font-weight:700;letter-spacing:.05em;fill:#A8228D}
    .badgeText{fill:#171317;font-weight:700;font-size:14px}
    .badgeTextTop{fill:#ffffff;font-weight:700;font-size:14px}
    .whiteH{font-weight:700;font-size:16px;fill:#ffffff}
    .whiteMono{font-family:'Courier New',monospace;font-size:12.5px;fill:#ffffff;opacity:.92}
  </style>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DA1A60"/><stop offset="1" stop-color="#A8228D"/></linearGradient>
    <filter id="s" x="-20%" y="-30%" width="140%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#171317" flood-opacity="0.10"/></filter>
    <filter id="g" x="-20%" y="-40%" width="140%" height="180%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#A8228D" flood-opacity="0.28"/></filter>
  </defs>

  <rect x="8" y="8" width="704" height="484" rx="20" fill="#FAF9FA"/>

  <text class="cap" x="40" y="42">HIGHEST PRIORITY — RESOLVED FIRST</text>

  <g filter="url(#g)"><rect x="40" y="52" width="500" height="54" rx="12" fill="url(#brand)"/></g>
  <circle cx="68" cy="79" r="14" fill="#ffffff"/><text class="badgeText" x="68" y="84" text-anchor="middle">1</text>
  <text class="whiteH" x="96" y="76">Runtime-specific environment variable</text>
  <text class="whiteMono" x="96" y="94">&lt;graft-name&gt;-config</text>

  <g filter="url(#s)"><rect class="row" x="40" y="118" width="500" height="54" rx="12"/></g>
  <circle cx="68" cy="145" r="14" fill="#F0ECF0"/><text class="badgeText" x="68" y="150" text-anchor="middle">2</text>
  <text class="h" x="96" y="142">Global environment variable</text>
  <text class="mono" x="96" y="160">graftcode-config</text>

  <g filter="url(#s)"><rect class="row" x="40" y="184" width="500" height="54" rx="12"/></g>
  <circle cx="68" cy="211" r="14" fill="#F0ECF0"/><text class="badgeText" x="68" y="216" text-anchor="middle">3</text>
  <text class="h" x="96" y="208">Runtime-specific file</text>
  <text class="mono" x="96" y="226">&lt;graft-name&gt;-config.json / .yaml / .txt</text>

  <g filter="url(#s)"><rect class="row" x="40" y="250" width="500" height="54" rx="12"/></g>
  <circle cx="68" cy="277" r="14" fill="#F0ECF0"/><text class="badgeText" x="68" y="282" text-anchor="middle">4</text>
  <text class="h" x="96" y="274">Global file</text>
  <text class="mono" x="96" y="292">graftcode-config.json / .yaml / .txt</text>

  <g filter="url(#s)"><rect class="row" x="40" y="316" width="500" height="54" rx="12"/></g>
  <circle cx="68" cy="343" r="14" fill="#F0ECF0"/><text class="badgeText" x="68" y="348" text-anchor="middle">5</text>
  <text class="h" x="96" y="340">User configuration</text>
  <text class="mono" x="96" y="358">SetConfig / setConfig</text>

  <g filter="url(#s)"><rect class="row" x="40" y="382" width="500" height="54" rx="12"/></g>
  <circle cx="68" cy="409" r="14" fill="#F0ECF0"/><text class="badgeText" x="68" y="414" text-anchor="middle">6</text>
  <text class="h" x="96" y="406">Generated library default</text>
  <text class="mono" x="96" y="424">host = inmemory</text>

  <text class="small" x="40" y="466">LOWEST PRIORITY — FALLBACK</text>

  <rect x="596" y="52" width="40" height="384" rx="20" fill="#F0ECF0"/>
  <text class="cap" x="616" y="244" text-anchor="middle" fill="#A8228D" transform="rotate(90 616 244)">checked top to bottom · first match wins</text>
</svg>
