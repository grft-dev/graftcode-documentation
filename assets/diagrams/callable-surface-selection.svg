<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 270" role="img" aria-labelledby="title desc">
  <title id="title">From public declarations to the callable-surface metadata</title>
  <desc id="desc">A language-specific analyzer takes public or exported declarations, applies type and method filters, validates supported types, and produces the callable-surface metadata, which package generation later consumes.</desc>
  <style>
    text{font:16px system-ui,sans-serif;fill:#171317}
    .h{font-weight:700;font-size:16px}
    .small{font-size:12.5px;fill:#706A70}
    .card{fill:#ffffff;stroke:#E6E2E6;stroke-width:1.5}
    .flow{stroke:#171317;stroke-width:2.2;fill:none}
    .meta{stroke:#A8228D;stroke-width:2;fill:none;stroke-dasharray:6 5}
    .ugmText{fill:#ffffff;font-weight:700;font-size:18px}
    .ugmSub{fill:#ffffff;font-size:12.5px;opacity:.92}
    .filterTag{font-size:11px;font-weight:700;letter-spacing:.05em;fill:#8A641F}
  </style>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DA1A60"/><stop offset="1" stop-color="#A8228D"/></linearGradient>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0l9 4.5-9 4.5z" fill="#171317"/></marker>
    <marker id="m" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0l9 4.5-9 4.5z" fill="#A8228D"/></marker>
    <filter id="s" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#171317" flood-opacity="0.10"/></filter>
    <filter id="g" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#A8228D" flood-opacity="0.28"/></filter>
  </defs>

  <rect x="8" y="8" width="1024" height="254" rx="20" fill="#FAF9FA"/>

  <g filter="url(#s)"><rect class="card" x="32" y="78" width="176" height="96" rx="14"/></g>
  <text class="h" x="120" y="118" text-anchor="middle">Public / exported</text>
  <text class="h" x="120" y="138" text-anchor="middle">declarations</text>
  <text class="small" x="120" y="160" text-anchor="middle">source of candidates</text>

  <g filter="url(#s)"><rect class="card" x="248" y="78" width="160" height="96" rx="14"/></g>
  <text class="filterTag" x="328" y="106" text-anchor="middle">FILTER</text>
  <text class="h" x="328" y="130" text-anchor="middle">Type filter</text>
  <text class="small" x="328" y="152" text-anchor="middle">include / exclude</text>

  <g filter="url(#s)"><rect class="card" x="448" y="78" width="160" height="96" rx="14"/></g>
  <text class="filterTag" x="528" y="106" text-anchor="middle">FILTER</text>
  <text class="h" x="528" y="130" text-anchor="middle">Method filter</text>
  <text class="small" x="528" y="152" text-anchor="middle">wildcards, names</text>

  <g filter="url(#s)"><rect class="card" x="648" y="78" width="176" height="96" rx="14"/></g>
  <text class="h" x="736" y="118" text-anchor="middle">Supported-type</text>
  <text class="h" x="736" y="138" text-anchor="middle">check</text>
  <text class="small" x="736" y="160" text-anchor="middle">per target generator</text>

  <g filter="url(#g)"><rect x="864" y="78" width="152" height="96" rx="14" fill="url(#brand)"/></g>
  <text class="ugmText" x="940" y="120" text-anchor="middle">Callable surface</text>
  <text class="ugmSub" x="940" y="142" text-anchor="middle">callable model</text>
  <text class="ugmSub" x="940" y="160" text-anchor="middle">language-neutral</text>

  <path class="flow" marker-end="url(#a)" d="M208 126h40M408 126h40M608 126h40M824 126h40"/>
  <path class="meta" marker-end="url(#m)" d="M940 174v34"/>
  <text class="small" x="940" y="228" text-anchor="middle" fill="#A8228D">consumed by package generation</text>

  <text class="h" x="380" y="52" font-size="19">Discovery is language-specific — the analyzer output is the authoritative surface</text>
  <text class="small" x="330" y="208" text-anchor="middle">filters narrow what becomes callable before validation</text>
</svg>
