<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Choosing a Graftcode scenario</title>
  <desc id="desc">From your integration goal, route to one of six Quick start courses: connect microservices, connect a frontend to a backend, use modules from another language, switch between monolith and microservices, expose a backend service, or expose methods as MCP tools.</desc>
  <style>
    text{font:16px system-ui,sans-serif;fill:#171317}
    .h{font-weight:700;font-size:17px}
    .course{font-size:13px;font-weight:600;fill:#A8228D}
    .card{fill:#ffffff;stroke:#E6E2E6;stroke-width:1.5}
    .flow{stroke:#B7B2B7;stroke-width:2;fill:none}
    .goalText{fill:#ffffff;font-weight:700;font-size:22px}
    .goalSub{fill:#ffffff;font-size:14px;opacity:.9}
  </style>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DA1A60"/><stop offset="1" stop-color="#A8228D"/></linearGradient>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0l9 4.5-9 4.5z" fill="#B7B2B7"/></marker>
    <filter id="s" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#171317" flood-opacity="0.10"/></filter>
    <filter id="g" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#A8228D" flood-opacity="0.30"/></filter>
  </defs>

  <rect x="8" y="8" width="884" height="484" rx="20" fill="#FAF9FA"/>

  <g filter="url(#g)"><rect x="36" y="200" width="272" height="100" rx="18" fill="url(#brand)"/></g>
  <text class="goalText" x="172" y="242" text-anchor="middle">Your integration</text>
  <text class="goalText" x="172" y="268" text-anchor="middle">goal</text>
  <text class="goalSub" x="172" y="290" text-anchor="middle">pick a scenario &#8594;</text>

  <path class="flow" marker-end="url(#a)" d="M308 250 C 356 250, 356 60, 404 60"/>
  <path class="flow" marker-end="url(#a)" d="M308 250 C 356 250, 356 134, 404 134"/>
  <path class="flow" marker-end="url(#a)" d="M308 250 C 356 250, 356 208, 404 208"/>
  <path class="flow" marker-end="url(#a)" d="M308 250 C 356 250, 356 288, 404 288"/>
  <path class="flow" marker-end="url(#a)" d="M308 250 C 356 250, 356 362, 404 362"/>
  <path class="flow" marker-end="url(#a)" d="M308 250 C 356 250, 356 436, 404 436"/>

  <g filter="url(#s)"><rect class="card" x="410" y="30" width="454" height="60" rx="12"/></g>
  <text class="h" x="430" y="56">One backend calls another</text>
  <text class="course" x="430" y="77">Connect microservices</text>

  <g filter="url(#s)"><rect class="card" x="410" y="104" width="454" height="60" rx="12"/></g>
  <text class="h" x="430" y="130">Frontend calls a backend</text>
  <text class="course" x="430" y="151">Connect frontend to backend</text>

  <g filter="url(#s)"><rect class="card" x="410" y="178" width="454" height="60" rx="12"/></g>
  <text class="h" x="430" y="204">Call a module in another language</text>
  <text class="course" x="430" y="225">Use modules from any technology</text>

  <g filter="url(#s)"><rect class="card" x="410" y="258" width="454" height="60" rx="12"/></g>
  <text class="h" x="430" y="284">Split or merge a deployment</text>
  <text class="course" x="430" y="305">Switch between monolith and microservices</text>

  <g filter="url(#s)"><rect class="card" x="410" y="332" width="454" height="60" rx="12"/></g>
  <text class="h" x="430" y="358">Expose a new Receiver</text>
  <text class="course" x="430" y="379">Expose a backend service</text>

  <g filter="url(#s)"><rect class="card" x="410" y="406" width="454" height="60" rx="12"/></g>
  <text class="h" x="430" y="432">Expose methods as AI tools</text>
  <text class="course" x="430" y="453">Expose MCP for AI</text>
</svg>
