<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" role="img" aria-labelledby="title desc">
  <title id="title">Build and package time versus runtime</title>
  <desc id="desc">At build and package time, a module is analyzed to a UGM and a Graft package is generated. At runtime, an installed Graft resolves configuration and invokes a hosted implementation without regenerating the package.</desc>
  <style>
    text{font:16px system-ui,sans-serif;fill:#171317}
    .h{font-weight:700;font-size:16px}
    .small{font-size:13px;fill:#706A70}
    .phase{font-weight:700;font-size:18px}
    .card{fill:#ffffff;stroke:#E6E2E6;stroke-width:1.5}
    .flow{stroke:#171317;stroke-width:2.2;fill:none}
    .divider{stroke:#B7B2B7;stroke-width:2;stroke-dasharray:7 7}
    .gh{fill:#ffffff;font-weight:700}
  </style>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DA1A60"/><stop offset="1" stop-color="#A8228D"/></linearGradient>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0l9 4.5-9 4.5z" fill="#171317"/></marker>
    <filter id="s" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#171317" flood-opacity="0.10"/></filter>
    <filter id="g" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#A8228D" flood-opacity="0.28"/></filter>
  </defs>

  <rect x="8" y="8" width="764" height="304" rx="20" fill="#FAF9FA"/>

  <text class="phase" x="205" y="46" text-anchor="middle">Build / package time</text>
  <text class="phase" x="580" y="46" text-anchor="middle">Runtime</text>
  <line class="divider" x1="390" y1="64" x2="390" y2="298"/>

  <g filter="url(#s)"><rect class="card" x="40" y="84" width="150" height="64" rx="12"/></g><text class="h" x="115" y="121" text-anchor="middle">Module</text>
  <g filter="url(#s)"><rect class="card" x="230" y="84" width="140" height="64" rx="12"/></g><text class="h" x="300" y="121" text-anchor="middle">UGM</text>
  <g filter="url(#g)"><rect x="140" y="204" width="170" height="70" rx="14" fill="url(#brand)"/></g>
  <text class="gh" x="225" y="234" text-anchor="middle">Generated</text><text class="gh" x="225" y="256" text-anchor="middle">Graft package</text>
  <path class="flow" marker-end="url(#a)" d="M190 116h40M300 148l-58 56"/>

  <g filter="url(#s)"><rect class="card" x="420" y="84" width="150" height="64" rx="12"/></g><text class="h" x="495" y="112" text-anchor="middle">Installed</text><text class="h" x="495" y="132" text-anchor="middle">Graft</text>
  <g filter="url(#s)"><rect class="card" x="600" y="84" width="150" height="64" rx="12"/></g><text class="h" x="675" y="112" text-anchor="middle">Resolved</text><text class="h" x="675" y="132" text-anchor="middle">configuration</text>
  <g filter="url(#s)"><rect class="card" x="510" y="204" width="180" height="70" rx="14"/></g><text class="h" x="600" y="234" text-anchor="middle">Hosted</text><text class="h" x="600" y="256" text-anchor="middle">implementation</text>
  <path class="flow" marker-end="url(#a)" d="M570 116h30M675 148l-58 56"/>

  <text class="small" x="600" y="296" text-anchor="middle">No analysis or package generation per call</text>
</svg>
