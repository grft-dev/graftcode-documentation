<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">Build and package time versus runtime</title>
  <desc id="desc">At build and package time, a module is analyzed to a UGM and a Graft package is generated. At runtime, an installed Graft resolves configuration and invokes a hosted implementation without regenerating the package.</desc>
  <style>text{font:16px system-ui,sans-serif;fill:#172033}.h{font-weight:700;font-size:18px}.box{fill:#f7f9fc;stroke:#52627a;stroke-width:2}.line{stroke:#52627a;stroke-width:2;fill:none}.divider{stroke:#9aa6b6;stroke-width:2;stroke-dasharray:7 7}.small{font-size:14px}</style>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#52627a"/></marker></defs>
  <text class="h" x="180" y="28" text-anchor="middle">Build / package time</text><text class="h" x="540" y="28" text-anchor="middle">Runtime</text>
  <line class="divider" x1="360" y1="10" x2="360" y2="285"/>
  <rect class="box" x="30" y="60" width="120" height="60" rx="10"/><text x="90" y="96" text-anchor="middle">Module</text>
  <rect class="box" x="205" y="60" width="120" height="60" rx="10"/><text x="265" y="96" text-anchor="middle">UGM</text>
  <rect class="box" x="118" y="175" width="150" height="60" rx="10"/><text x="193" y="201" text-anchor="middle">Generated</text><text x="193" y="223" text-anchor="middle">Graft package</text>
  <path class="line" marker-end="url(#a)" d="M150 90h55M265 120l-48 55"/>
  <rect class="box" x="395" y="60" width="135" height="60" rx="10"/><text x="462" y="86" text-anchor="middle">Installed</text><text x="462" y="108" text-anchor="middle">Graft</text>
  <rect class="box" x="560" y="60" width="130" height="60" rx="10"/><text x="625" y="86" text-anchor="middle">Resolved</text><text x="625" y="108" text-anchor="middle">configuration</text>
  <rect class="box" x="470" y="175" width="160" height="60" rx="10"/><text x="550" y="201" text-anchor="middle">Hosted</text><text x="550" y="223" text-anchor="middle">implementation</text>
  <path class="line" marker-end="url(#a)" d="M530 90h30M625 120l-56 55M470 205h-35V120"/>
  <text class="small" x="540" y="270" text-anchor="middle">No analysis or package generation per call</text>
</svg>
