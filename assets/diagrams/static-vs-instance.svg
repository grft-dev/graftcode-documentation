<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" role="img" aria-labelledby="title desc">
  <title id="title">Static versus instance operations</title>
  <desc id="desc">A static operation is a type-level call with no object construction. An instance operation constructs an object whose runtime context is retained across a sequence of calls; that context is bound to the runtime and is not a durable identifier.</desc>
  <style>
    text{font:16px system-ui,sans-serif;fill:#171317}
    .h{font-weight:700;font-size:16px}
    .small{font-size:12.5px;fill:#706A70}
    .mono{font-family:'Courier New',monospace;font-size:14px;fill:#171317}
    .card{fill:#ffffff;stroke:#E6E2E6;stroke-width:1.5}
    .code{fill:#F5F4F5;stroke:#E6E2E6;stroke-width:1.5}
    .flow{stroke:#171317;stroke-width:2.2;fill:none}
    .pillText{fill:#ffffff;font-weight:700;font-size:15px}
    .pillDark{fill:#ffffff;font-weight:700;font-size:15px}
  </style>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DA1A60"/><stop offset="1" stop-color="#A8228D"/></linearGradient>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0l9 4.5-9 4.5z" fill="#171317"/></marker>
    <filter id="s" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#171317" flood-opacity="0.10"/></filter>
    <filter id="g" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#A8228D" flood-opacity="0.28"/></filter>
  </defs>

  <rect x="8" y="8" width="804" height="324" rx="20" fill="#FAF9FA"/>

  <rect x="60" y="30" width="260" height="34" rx="17" fill="#2B2530"/>
  <text class="pillDark" x="190" y="52" text-anchor="middle">Static operation</text>
  <g filter="url(#g)"><rect x="500" y="30" width="260" height="34" rx="17" fill="url(#brand)"/></g>
  <text class="pillText" x="630" y="52" text-anchor="middle">Instance operation</text>

  <!-- static column -->
  <g filter="url(#s)"><rect class="card" x="60" y="86" width="260" height="46" rx="12"/></g><text x="190" y="114" text-anchor="middle">Caller</text>
  <path class="flow" marker-end="url(#a)" d="M190 132v26"/>
  <g filter="url(#s)"><rect class="code" x="60" y="162" width="260" height="60" rx="12"/></g>
  <text class="mono" x="190" y="188" text-anchor="middle">Service.Calculate(a, b)</text>
  <text class="small" x="190" y="209" text-anchor="middle">no object constructed</text>
  <path class="flow" marker-end="url(#a)" d="M190 222v26"/>
  <g filter="url(#s)"><rect class="card" x="60" y="252" width="260" height="56" rx="12"/></g>
  <text class="h" x="190" y="278" text-anchor="middle">Type-level execution</text>
  <text class="small" x="190" y="297" text-anchor="middle">static is not automatically stateless</text>

  <!-- instance column -->
  <g filter="url(#s)"><rect class="card" x="500" y="86" width="260" height="46" rx="12"/></g><text x="630" y="114" text-anchor="middle">Caller</text>
  <path class="flow" marker-end="url(#a)" d="M630 132v26"/>
  <g filter="url(#s)"><rect class="code" x="500" y="162" width="260" height="60" rx="12"/></g>
  <text class="mono" x="630" y="188" text-anchor="middle">obj = new Service(seed)</text>
  <text class="small" x="630" y="209" text-anchor="middle">runtime context retained</text>
  <path class="flow" marker-end="url(#a)" d="M630 222v26"/>
  <g filter="url(#s)"><rect class="code" x="500" y="252" width="260" height="56" rx="12"/></g>
  <text class="mono" x="630" y="280" text-anchor="middle">obj.Next() ... obj.Next()</text>
  <text class="small" x="630" y="299" text-anchor="middle">context not durable across restarts</text>
</svg>
