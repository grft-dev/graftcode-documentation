<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" role="img" aria-labelledby="title desc">
  <title id="title">Public surface vs implementation boundary</title>
  <desc id="desc">Implementation stays in your environment; Graftcode Engine stores public method signatures and creates Grafts from public interfaces.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#FFFFFF"/>
    </marker>
    <marker id="arrowMuted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#9BB0C4"/>
    </marker>
  </defs>
  <rect width="800" height="280" fill="#0B1B2E"/>
  <style>
    .title { font: 700 22px Georgia, "Times New Roman", serif; fill: #FFFFFF; letter-spacing: 0.04em; }
    .h { font: 600 15px Consolas, "Courier New", monospace; fill: #FFFFFF; }
    .small { font: 12px Consolas, "Courier New", monospace; fill: #9BB0C4; }
    .cap { font: 700 11px Consolas, "Courier New", monospace; fill: #9BB0C4; letter-spacing: 0.08em; }
    .mono { font: 600 13px Consolas, "Courier New", monospace; fill: #FFFFFF; }
    .edge { font: 11px Consolas, "Courier New", monospace; fill: #9BB0C4; }
    .box { fill: none; stroke: #FFFFFF; stroke-width: 1.6; }
    .boxMuted { fill: none; stroke: #9BB0C4; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .flow { fill: none; stroke: #FFFFFF; stroke-width: 1.6; marker-end: url(#arrow); }
    .flowMuted { fill: none; stroke: #9BB0C4; stroke-width: 1.4; stroke-dasharray: 6 5; marker-end: url(#arrowMuted); }
    .track { fill: none; stroke: #9BB0C4; stroke-width: 2; }
  </style>
  
  <text class="title" x="400" y="34" text-anchor="middle">Public surface vs implementation</text>
  <text class="cap" x="200" y="70" text-anchor="middle">YOUR ENVIRONMENT</text>
  <text class="cap" x="620" y="70" text-anchor="middle">GRAFTCODE ENGINE</text>
  <rect class="box" x="40" y="90" width="320" height="150" rx="12"/><text class="h" x="200" y="130" text-anchor="middle">Business logic · Gateway · secrets</text><text class="small" x="200" y="152" text-anchor="middle">CI/CD · tests · infrastructure</text>
  <rect class="box" x="440" y="90" width="320" height="150" rx="12"/><text class="h" x="600" y="124" text-anchor="middle">Stores public method signatures</text><text class="small" x="600" y="146" text-anchor="middle">Creates Grafts from interfaces</text>
  <path class="flow" d="M360 165 H440"/><text class="edge" x="400" y="156">publish public interface</text>
  <path class="flowMuted" d="M440 190 H360"/><text class="edge" x="400" y="206">use generated Grafts</text>

</svg>
