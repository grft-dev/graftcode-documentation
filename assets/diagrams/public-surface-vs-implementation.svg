<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">Public callable surface and private implementation</title>
  <desc id="desc">Consumers depend on the analyzer-selected public callable surface. The surface delegates to private helpers, storage, frameworks, and other implementation details that are not represented as the public contract.</desc>
  <style>
    text{font:16px system-ui,sans-serif;fill:#171317}
    .h{font-weight:700}
    .small{font-size:13px;fill:#706A70}
    .card{fill:#ffffff;stroke:#E6E2E6;stroke-width:1.5}
    .flow{stroke:#171317;stroke-width:2.2;fill:none}
    .gh{fill:#ffffff;font-weight:700;font-size:17px}
    .gsub{fill:#ffffff;opacity:.92;font-size:13px}
  </style>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DA1A60"/><stop offset="1" stop-color="#A8228D"/></linearGradient>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0l9 4.5-9 4.5z" fill="#171317"/></marker>
    <filter id="s" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#171317" flood-opacity="0.10"/></filter>
    <filter id="g" x="-15%" y="-40%" width="130%" height="190%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#A8228D" flood-opacity="0.26"/></filter>
  </defs>

  <rect x="8" y="8" width="744" height="284" rx="20" fill="#FAF9FA"/>

  <g filter="url(#g)"><rect x="40" y="44" width="680" height="82" rx="16" fill="url(#brand)"/></g>
  <text class="gh" x="380" y="80" text-anchor="middle">Callable surface — exposed through Gateway</text>
  <text class="gsub" x="380" y="104" text-anchor="middle">selected public / exported types, constructors, methods, fields, and properties</text>

  <path class="flow" marker-end="url(#a)" d="M380 126v40"/>

  <g filter="url(#s)"><rect class="card" x="40" y="170" width="680" height="100" rx="16"/></g>
  <text class="h" x="380" y="204" text-anchor="middle">Implementation — not the generated contract</text>
  <text class="small" x="380" y="230" text-anchor="middle">private helpers · persistence · frameworks · secrets · transport adapters</text>
  <text class="small" x="380" y="252" text-anchor="middle">authorization and business behavior execute here</text>
</svg>
