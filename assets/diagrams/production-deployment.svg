<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" role="img" aria-labelledby="title desc">
  <title id="title">Graftcode production deployment topology</title>
  <desc id="desc">Caller traffic flows through ingress and a load balancer to Gateway plus Receiver replicas; registry and Graftcode Engine sit on a separate control plane.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#FFFFFF"/>
    </marker>
    <marker id="arrowMuted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#9BB0C4"/>
    </marker>
  </defs>
  <rect width="1120" height="440" fill="#0B1B2E"/>
  <style>
    .title { font: 700 22px Georgia, "Times New Roman", serif; fill: #FFFFFF; letter-spacing: 0.04em; }
    .h { font: 600 15px Consolas, "Courier New", monospace; fill: #FFFFFF; }
    .small { font: 12px Consolas, "Courier New", monospace; fill: #9BB0C4; }
    .cap { font: 700 11px Consolas, "Courier New", monospace; fill: #9BB0C4; letter-spacing: 0.08em; }
    .mono { font: 600 13px Consolas, "Courier New", monospace; fill: #FFFFFF; }
    .edge { font: 11px Consolas, "Courier New", monospace; fill: #9BB0C4; }
    .box { fill: none; stroke: #FFFFFF; stroke-width: 1.6; }
    .boxMuted { fill: none; stroke: #9BB0C4; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .flow { fill: none; stroke: #FFFFFF; stroke-width: 1.6; marker-end: url(#arrow); }
    .flowMuted { fill: none; stroke: #9BB0C4; stroke-width: 1.4; stroke-dasharray: 6 5; marker-end: url(#arrowMuted); }
    .track { fill: none; stroke: #9BB0C4; stroke-width: 2; }
  </style>
  
  <text class="title" x="560" y="34" text-anchor="middle">Production deployment topology</text>
  <rect class="box" x="28" y="148" width="150" height="60" rx="12"/><text class="h" x="103" y="174" text-anchor="middle">Caller</text><text class="small" x="103" y="194" text-anchor="middle">installed Graft</text>
  <rect class="box" x="210" y="148" width="140" height="60" rx="12"/><text class="h" x="280" y="174" text-anchor="middle">TLS/WSS ingress</text>
  <rect class="box" x="382" y="148" width="150" height="60" rx="12"/><text class="h" x="457" y="170" text-anchor="middle">Load balancer</text><text class="small" x="457" y="190" text-anchor="middle">affinity if stateful</text>
  <rect class="boxMuted" x="564" y="60" width="380" height="300" rx="14"/>
  <text class="cap" x="580" y="82">RECEIVER ENVIRONMENT</text>
  <rect class="box" x="584" y="96" width="200" height="42" rx="12"/><text class="h" x="684" y="122" text-anchor="middle">Gateway (gg)</text><rect class="box" x="584" y="144" width="200" height="42" rx="12"/><text class="h" x="684" y="170" text-anchor="middle">Receiver</text>
  <rect class="box" x="820" y="120" width="104" height="46" rx="12"/><text class="small" x="872" y="146" text-anchor="middle">dependencies</text>
  <rect class="box" x="584" y="238" width="200" height="42" rx="12"/><text class="h" x="684" y="264" text-anchor="middle">Gateway (gg)</text><rect class="box" x="584" y="286" width="200" height="42" rx="12"/><text class="h" x="684" y="312" text-anchor="middle">Receiver</text>
  <rect class="box" x="820" y="262" width="104" height="46" rx="12"/><text class="small" x="872" y="288" text-anchor="middle">dependencies</text>
  <path class="flow" d="M178 178 H210"/><path class="flow" d="M350 178 H382"/><path class="flow" d="M532 178 C556 178 556 117 584 117"/><path class="flow" d="M532 178 C556 178 556 259 584 259"/>
  <path class="flow" d="M784 165 H820"/><path class="flow" d="M784 307 H820"/>
  <text class="cap" x="44" y="292">CONTROL PLANE (not runtime data path)</text>
  <rect class="box" x="28" y="304" width="240" height="52" rx="12"/><text class="h" x="148" y="326" text-anchor="middle">Registry</text><text class="small" x="148" y="344" text-anchor="middle">install-time</text>
  <rect class="box" x="288" y="304" width="240" height="52" rx="12"/><text class="h" x="408" y="326" text-anchor="middle">Graftcode Engine</text><text class="small" x="408" y="344" text-anchor="middle">setup-time generation</text>
  <path class="flowMuted" d="M103 208 V304"/><text class="edge" x="118" y="248">install time</text>

</svg>
