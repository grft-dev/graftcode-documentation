<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" role="img" aria-labelledby="title desc">
  <title id="title">Graftcode production deployment topology</title>
  <desc id="desc">A Caller sends runtime calls over TLS/WSS to reviewed ingress, which forwards to a load balancer. The load balancer distributes stateless calls across identical Gateway plus Receiver replicas, and uses connection affinity to keep stateful calls on one replica. Each replica reaches its own dependencies. The registry (install time) and Graftcode Engine (setup time) are separate control-plane services and are not on the runtime data path.</desc>
  <style>
    text{font:15px system-ui,sans-serif;fill:#171317}
    .h{font-weight:700;font-size:15px}
    .small{font-size:12px;fill:#706A70}
    .zone{font-size:11px;font-weight:700;letter-spacing:.05em;fill:#8A7E8A}
    .card{fill:#ffffff;stroke:#E6E2E6;stroke-width:1.5}
    .env{fill:none;stroke:#B7B2B7;stroke-width:1.5;stroke-dasharray:5 4}
    .flow{stroke:#171317;stroke-width:2.2;fill:none}
    .meta{stroke:#A8228D;stroke-width:2;fill:none;stroke-dasharray:6 5}
    .gh{fill:#ffffff;font-weight:700;font-size:15px}
    .gsub{fill:#ffffff;opacity:.92;font-size:12px}
    .edge{font-size:11.5px;fill:#706A70}
  </style>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DA1A60"/><stop offset="1" stop-color="#A8228D"/></linearGradient>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0l9 4.5-9 4.5z" fill="#171317"/></marker>
    <marker id="m" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0l9 4.5-9 4.5z" fill="#A8228D"/></marker>
    <filter id="s" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#171317" flood-opacity="0.10"/></filter>
    <filter id="g" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#A8228D" flood-opacity="0.26"/></filter>
  </defs>

  <rect x="8" y="8" width="1104" height="424" rx="20" fill="#FAF9FA"/>

  <!-- Caller -->
  <g filter="url(#s)"><rect class="card" x="28" y="150" width="150" height="60" rx="12"/></g>
  <text class="h" x="103" y="176" text-anchor="middle">Caller</text><text class="small" x="103" y="196" text-anchor="middle">installed Graft</text>

  <!-- Ingress -->
  <g filter="url(#s)"><rect class="card" x="210" y="150" width="140" height="60" rx="12"/></g>
  <text class="h" x="280" y="176" text-anchor="middle">TLS/WSS ingress</text><text class="small" x="280" y="196" text-anchor="middle">TLS terminates</text>

  <!-- Load balancer -->
  <g filter="url(#s)"><rect class="card" x="382" y="150" width="150" height="60" rx="12"/></g>
  <text class="h" x="457" y="172" text-anchor="middle">Load balancer</text><text class="small" x="457" y="192" text-anchor="middle">affinity for stateful</text>

  <!-- Receiver environment with replicas -->
  <rect class="env" x="564" y="60" width="380" height="300" rx="14"/>
  <text class="zone" x="580" y="82">RECEIVER ENVIRONMENT (replicas)</text>

  <!-- replica 1 -->
  <g filter="url(#g)"><rect x="584" y="96" width="200" height="42" rx="10" fill="url(#brand)"/></g><text class="gh" x="684" y="122" text-anchor="middle">Gateway (gg)</text>
  <g filter="url(#s)"><rect class="card" x="584" y="144" width="200" height="42" rx="10"/></g><text class="h" x="684" y="170" text-anchor="middle">Receiver</text>
  <g filter="url(#s)"><rect class="card" x="820" y="120" width="104" height="46" rx="10"/></g><text class="small" x="872" y="140" text-anchor="middle">dependencies</text><text class="small" x="872" y="156" text-anchor="middle">(DB, cache)</text>
  <path class="flow" marker-end="url(#a)" d="M784 165 H820"/>

  <!-- replica 2 -->
  <g filter="url(#g)"><rect x="584" y="238" width="200" height="42" rx="10" fill="url(#brand)"/></g><text class="gh" x="684" y="264" text-anchor="middle">Gateway (gg)</text>
  <g filter="url(#s)"><rect class="card" x="584" y="286" width="200" height="42" rx="10"/></g><text class="h" x="684" y="312" text-anchor="middle">Receiver</text>
  <g filter="url(#s)"><rect class="card" x="820" y="262" width="104" height="46" rx="10"/></g><text class="small" x="872" y="282" text-anchor="middle">dependencies</text><text class="small" x="872" y="298" text-anchor="middle">(DB, cache)</text>
  <path class="flow" marker-end="url(#a)" d="M784 307 H820"/>

  <!-- flows -->
  <path class="flow" marker-end="url(#a)" d="M178 180 H210"/>
  <path class="flow" marker-end="url(#a)" d="M350 180 H382"/>
  <path class="flow" marker-end="url(#a)" d="M532 180 C 556 180 556 117 584 117"/>
  <path class="flow" marker-end="url(#a)" d="M532 180 C 556 180 556 259 584 259"/>
  <text class="edge" x="194" y="170" text-anchor="middle">TLS/WSS</text>
  <text class="edge" x="548" y="150" text-anchor="middle">stateless: any replica</text>
  <text class="edge" x="548" y="238" text-anchor="middle">stateful: pinned</text>

  <!-- Control plane -->
  <text class="zone" x="44" y="290">CONTROL PLANE (not the runtime data path)</text>
  <g filter="url(#s)"><rect class="card" x="28" y="302" width="240" height="52" rx="12"/></g>
  <text class="h" x="148" y="324" text-anchor="middle">Registry</text><text class="small" x="148" y="342" text-anchor="middle">install-time package download</text>
  <g filter="url(#s)"><rect class="card" x="288" y="302" width="240" height="52" rx="12"/></g>
  <text class="h" x="408" y="324" text-anchor="middle">Graftcode Engine</text><text class="small" x="408" y="342" text-anchor="middle">setup-time metadata + generation</text>
  <path class="meta" marker-end="url(#m)" d="M103 210 V302"/>
  <text class="edge" x="103" y="250" text-anchor="middle" fill="#A8228D">install time</text>
</svg>
