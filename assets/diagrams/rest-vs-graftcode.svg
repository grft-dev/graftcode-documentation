<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" role="img" aria-labelledby="title desc">
  <title id="title">REST and Graftcode integration models</title>
  <desc id="desc">REST uses a client, routes and verbs, payload schemas, and server handlers. Graftcode analyzes a callable surface, generates a Graft package, and invokes a hosted implementation through the runtime bridge.</desc>
  <style>
    text{font:15px system-ui,sans-serif;fill:#171317}
    .h{font-weight:700;font-size:15px}
    .small{font-size:12.5px;fill:#706A70}
    .phase{font-weight:700;font-size:18px}
    .card{fill:#ffffff;stroke:#E6E2E6;stroke-width:1.5}
    .flow{stroke:#171317;stroke-width:2.2;fill:none}
    .divider{stroke:#B7B2B7;stroke-width:2;stroke-dasharray:7 7}
    .gh{fill:#ffffff;font-weight:700;font-size:15px}
    .gsub{fill:#ffffff;opacity:.92;font-size:12.5px}
  </style>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DA1A60"/><stop offset="1" stop-color="#A8228D"/></linearGradient>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0l9 4.5-9 4.5z" fill="#171317"/></marker>
    <filter id="s" x="-20%" y="-25%" width="140%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#171317" flood-opacity="0.10"/></filter>
    <filter id="g" x="-45%" y="-45%" width="190%" height="190%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#A8228D" flood-opacity="0.28"/></filter>
  </defs>

  <rect x="8" y="8" width="764" height="304" rx="20" fill="#FAF9FA"/>

  <text class="phase" x="200" y="46" text-anchor="middle">REST</text>
  <text class="phase" x="580" y="46" text-anchor="middle">Graftcode</text>
  <line class="divider" x1="390" y1="64" x2="390" y2="298"/>

  <g filter="url(#s)"><rect class="card" x="40" y="82" width="150" height="60" rx="12"/></g><text class="h" x="115" y="117" text-anchor="middle">HTTP client</text>
  <g filter="url(#s)"><rect class="card" x="210" y="82" width="150" height="60" rx="12"/></g><text class="h" x="285" y="108" text-anchor="middle">Route + verb</text><text class="small" x="285" y="128" text-anchor="middle">payload schema</text>
  <g filter="url(#s)"><rect class="card" x="120" y="200" width="160" height="64" rx="12"/></g><text class="h" x="200" y="226" text-anchor="middle">Server handler</text><text class="small" x="200" y="246" text-anchor="middle">implementation</text>
  <path class="flow" marker-end="url(#a)" d="M190 112h20M285 142l-62 58"/>

  <g filter="url(#s)"><rect class="card" x="400" y="82" width="150" height="60" rx="12"/></g><text class="h" x="475" y="108" text-anchor="middle">Callable surface</text><text class="small" x="475" y="128" text-anchor="middle">captured as metadata</text>
  <g filter="url(#g)"><rect x="575" y="82" width="150" height="60" rx="12" fill="url(#brand)"/></g><text class="gh" x="650" y="108" text-anchor="middle">Generated Graft</text><text class="gsub" x="650" y="128" text-anchor="middle">Caller package</text>
  <g filter="url(#s)"><rect class="card" x="490" y="200" width="170" height="64" rx="12"/></g><text class="h" x="575" y="226" text-anchor="middle">Runtime bridge</text><text class="small" x="575" y="246" text-anchor="middle">hosted implementation</text>
  <path class="flow" marker-end="url(#a)" d="M550 112h25M650 142l-62 58"/>

  <text class="small" x="390" y="298" text-anchor="middle">Both remote forms retain network and process failure modes</text>
</svg>
