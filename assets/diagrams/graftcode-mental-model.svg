<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" role="img" aria-labelledby="title desc">
  <title id="title">The Graftcode mental model in five steps</title>
  <desc id="desc">Your module is user-written; the Graft is generated; Graftcode Gateway hosts and analyzes the module; configuration selects in-memory or remote execution; and a remote Graft call is still a distributed call.</desc>
  <style>
    text{font:16px system-ui,sans-serif;fill:#171317}
    .h{font-weight:700;font-size:17px}
    .small{font-size:13px;fill:#706A70}
    .cap{font-size:12px;font-weight:600;letter-spacing:.04em}
    .card{fill:#ffffff;stroke:#E6E2E6;stroke-width:1.5}
    .flow{stroke:#171317;stroke-width:2.2;fill:none}
    .badgeText{fill:#ffffff;font-weight:700;font-size:15px}
  </style>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DA1A60"/><stop offset="1" stop-color="#A8228D"/></linearGradient>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0l9 4.5-9 4.5z" fill="#171317"/></marker>
    <filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#171317" flood-opacity="0.10"/></filter>
  </defs>

  <rect x="8" y="8" width="1024" height="284" rx="20" fill="#FAF9FA"/>

  <!-- cards -->
  <g filter="url(#s)"><rect class="card" x="36" y="70" width="176" height="150" rx="16"/></g>
  <circle cx="66" cy="100" r="15" fill="url(#brand)"/><text class="badgeText" x="66" y="105" text-anchor="middle">1</text>
  <text class="h" x="124" y="140" text-anchor="middle">Your module</text>
  <text class="small" x="124" y="165" text-anchor="middle">ordinary class</text>
  <text class="small" x="124" y="183" text-anchor="middle">or package</text>
  <circle cx="52" cy="204" r="5" fill="#39734A"/><text class="cap" x="66" y="208" fill="#39734A">YOU WRITE</text>

  <g filter="url(#s)"><rect class="card" x="240" y="70" width="176" height="150" rx="16"/></g>
  <rect x="240" y="70" width="6" height="150" rx="3" fill="url(#brand)"/>
  <circle cx="270" cy="100" r="15" fill="url(#brand)"/><text class="badgeText" x="270" y="105" text-anchor="middle">2</text>
  <text class="h" x="328" y="140" text-anchor="middle">Generated Graft</text>
  <text class="small" x="328" y="165" text-anchor="middle">typed package for</text>
  <text class="small" x="328" y="183" text-anchor="middle">the Caller</text>
  <circle cx="256" cy="204" r="5" fill="#C51E78"/><text class="cap" x="270" y="208" fill="#C51E78">GENERATED</text>

  <g filter="url(#s)"><rect class="card" x="444" y="70" width="176" height="150" rx="16"/></g>
  <circle cx="474" cy="100" r="15" fill="url(#brand)"/><text class="badgeText" x="474" y="105" text-anchor="middle">3</text>
  <text class="h" x="532" y="140" text-anchor="middle">Gateway hosts</text>
  <text class="small" x="532" y="165" text-anchor="middle">loads module,</text>
  <text class="small" x="532" y="183" text-anchor="middle">publishes model</text>
  <circle cx="460" cy="204" r="5" fill="#52627A"/><text class="cap" x="474" y="208" fill="#52627A">OPERATED</text>

  <g filter="url(#s)"><rect class="card" x="648" y="70" width="176" height="150" rx="16"/></g>
  <circle cx="678" cy="100" r="15" fill="url(#brand)"/><text class="badgeText" x="678" y="105" text-anchor="middle">4</text>
  <text class="h" x="736" y="140" text-anchor="middle">Config selects</text>
  <text class="small" x="736" y="165" text-anchor="middle">in-memory or</text>
  <text class="small" x="736" y="183" text-anchor="middle">remote host</text>
  <circle cx="662" cy="204" r="5" fill="#8A641F"/><text class="cap" x="676" y="208" fill="#8A641F">CONFIG</text>

  <g filter="url(#s)"><rect class="card" x="852" y="70" width="176" height="150" rx="16"/></g>
  <circle cx="882" cy="100" r="15" fill="url(#brand)"/><text class="badgeText" x="882" y="105" text-anchor="middle">5</text>
  <text class="h" x="940" y="140" text-anchor="middle">Still distributed</text>
  <text class="small" x="940" y="165" text-anchor="middle">failures, security,</text>
  <text class="small" x="940" y="183" text-anchor="middle">retries apply</text>
  <circle cx="866" cy="204" r="5" fill="#52627A"/><text class="cap" x="880" y="208" fill="#52627A">OPERATED</text>

  <path class="flow" marker-end="url(#a)" d="M212 145h24M416 145h24M620 145h24M824 145h24"/>

  <text class="h" x="520" y="44" text-anchor="middle" font-size="19">Same programming model — from your code to a live cross-language call</text>
</svg>
