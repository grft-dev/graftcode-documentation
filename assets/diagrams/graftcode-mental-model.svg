<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 300" role="img" aria-labelledby="title desc">
  <title id="title">The Graftcode mental model in five steps</title>
  <desc id="desc">Your module is user-written; the Graft is generated; you host with Gateway or install from the public repository; configuration selects monolith or microservice; remote calls remain distributed.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#FFFFFF"/>
    </marker>
    <marker id="arrowMuted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#9BB0C4"/>
    </marker>
  </defs>
  <rect width="1080" height="300" fill="#0B1B2E"/>
  <style>
    .title { font: 700 22px Georgia, "Times New Roman", serif; fill: #FFFFFF; letter-spacing: 0.04em; }
    .h { font: 600 15px Consolas, "Courier New", monospace; fill: #FFFFFF; }
    .small { font: 12px Consolas, "Courier New", monospace; fill: #9BB0C4; }
    .cap { font: 700 11px Consolas, "Courier New", monospace; fill: #9BB0C4; letter-spacing: 0.08em; }
    .mono { font: 600 13px Consolas, "Courier New", monospace; fill: #FFFFFF; }
    .edge { font: 11px Consolas, "Courier New", monospace; fill: #9BB0C4; }
    .box { fill: none; stroke: #FFFFFF; stroke-width: 1.6; }
    .boxMuted { fill: none; stroke: #9BB0C4; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .flow { fill: none; stroke: #FFFFFF; stroke-width: 1.6; marker-end: url(#arrow); }
    .flowMuted { fill: none; stroke: #9BB0C4; stroke-width: 1.4; stroke-dasharray: 6 5; marker-end: url(#arrowMuted); }
    .track { fill: none; stroke: #9BB0C4; stroke-width: 2; }
  </style>
  <text class="title" x="540" y="34" text-anchor="middle">Five things to remember</text>
  <rect class="box" x="44" y="68" width="176" height="148" rx="12"/>
  <text class="mono" x="132" y="104" text-anchor="middle">1</text>
  <text class="h" x="132" y="132" text-anchor="middle">Your module</text>
  <text class="small" x="132" y="154" text-anchor="middle">ordinary class</text>
  <text class="small" x="132" y="170" text-anchor="middle">or package</text>
  <text class="cap" x="132" y="198" text-anchor="middle">YOU WRITE</text>
  <rect class="box" x="248" y="68" width="176" height="148" rx="12"/>
  <text class="mono" x="336" y="104" text-anchor="middle">2</text>
  <text class="h" x="336" y="132" text-anchor="middle">Generated Graft</text>
  <text class="small" x="336" y="154" text-anchor="middle">typed package for</text>
  <text class="small" x="336" y="170" text-anchor="middle">the Caller</text>
  <text class="cap" x="336" y="198" text-anchor="middle">GENERATED</text>
  <rect class="box" x="452" y="68" width="176" height="148" rx="12"/>
  <text class="mono" x="540" y="104" text-anchor="middle">3</text>
  <text class="h" x="540" y="132" text-anchor="middle">Gateway or</text>
  <text class="small" x="540" y="154" text-anchor="middle">host module or install</text>
  <text class="small" x="540" y="170" text-anchor="middle">from public repository</text>
  <text class="cap" x="540" y="198" text-anchor="middle">OPERATED</text>
  <rect class="box" x="656" y="68" width="176" height="148" rx="12"/>
  <text class="mono" x="744" y="104" text-anchor="middle">4</text>
  <text class="h" x="744" y="132" text-anchor="middle">Monolith or</text>
  <text class="small" x="744" y="154" text-anchor="middle">in-memory or</text>
  <text class="small" x="744" y="170" text-anchor="middle">remote host</text>
  <text class="cap" x="744" y="198" text-anchor="middle">CONFIG</text>
  <rect class="box" x="860" y="68" width="176" height="148" rx="12"/>
  <text class="mono" x="948" y="104" text-anchor="middle">5</text>
  <text class="h" x="948" y="132" text-anchor="middle">Still distributed</text>
  <text class="small" x="948" y="154" text-anchor="middle">failures, security,</text>
  <text class="small" x="948" y="170" text-anchor="middle">retries apply</text>
  <text class="cap" x="948" y="198" text-anchor="middle">OPERATED</text>
  <path class="flow" d="M220 142 H244"/>
  <path class="flow" d="M424 142 H448"/>
  <path class="flow" d="M628 142 H652"/>
  <path class="flow" d="M832 142 H856"/>
</svg>
