<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="title desc">
  <title id="title">Runtime Graft invocation</title>
  <desc id="desc">A consumer calls a generated wrapper. Configuration selects a connection, Hypertube serializes and transports a command, the receiver dispatches it to the implementation, and a response returns.</desc>
  <style>text{font:15px system-ui,sans-serif;fill:#172033}.h{font-weight:700}.box{fill:#f7f9fc;stroke:#52627a;stroke-width:2}.line{stroke:#52627a;stroke-width:2;fill:none}.return{stroke:#2764a8;stroke-width:2;fill:none;stroke-dasharray:6 5}.small{font-size:13px}</style>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#52627a"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#2764a8"/></marker></defs>
  <rect class="box" x="15" y="55" width="115" height="65" rx="9"/><text class="h" x="72" y="82" text-anchor="middle">Consumer</text><text class="small" x="72" y="104" text-anchor="middle">method call</text>
  <rect class="box" x="160" y="55" width="125" height="65" rx="9"/><text class="h" x="222" y="82" text-anchor="middle">Generated</text><text class="small" x="222" y="104" text-anchor="middle">wrapper + config</text>
  <rect class="box" x="315" y="55" width="115" height="65" rx="9"/><text class="h" x="372" y="82" text-anchor="middle">Hypertube</text><text class="small" x="372" y="104" text-anchor="middle">serialize + send</text>
  <rect class="box" x="460" y="55" width="105" height="65" rx="9"/><text class="h" x="512" y="82" text-anchor="middle">Receiver</text><text class="small" x="512" y="104" text-anchor="middle">dispatch</text>
  <rect class="box" x="595" y="55" width="110" height="65" rx="9"/><text class="h" x="650" y="82" text-anchor="middle">Hosted</text><text class="small" x="650" y="104" text-anchor="middle">implementation</text>
  <path class="line" marker-end="url(#a)" d="M130 87h30M285 87h30M430 87h30M565 87h30"/>
  <path class="return" marker-end="url(#b)" d="M650 145v45H72v-70"/>
  <text x="360" y="215" text-anchor="middle" fill="#2764a8">response or error</text>
</svg>
