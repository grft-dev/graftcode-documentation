<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 310" role="img" aria-labelledby="title desc">
  <title id="title">Type mapping across Receiver, interface metadata, and target generator</title>
  <desc id="desc">A Receiver type becomes language-neutral interface metadata and maps to a Caller type; unsupported framework types are rejected during package generation.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#FFFFFF"/>
    </marker>
    <marker id="arrowMuted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#9BB0C4"/>
    </marker>
  </defs>
  <rect width="1040" height="310" fill="#0B1B2E"/>
  <style>
    .title { font: 700 22px Georgia, "Times New Roman", serif; fill: #FFFFFF; letter-spacing: 0.04em; }
    .h { font: 600 15px Consolas, "Courier New", monospace; fill: #FFFFFF; }
    .small { font: 12px Consolas, "Courier New", monospace; fill: #9BB0C4; }
    .cap { font: 700 11px Consolas, "Courier New", monospace; fill: #9BB0C4; letter-spacing: 0.08em; }
    .mono { font: 600 13px Consolas, "Courier New", monospace; fill: #FFFFFF; }
    .edge { font: 11px Consolas, "Courier New", monospace; fill: #9BB0C4; }
    .box { fill: none; stroke: #FFFFFF; stroke-width: 1.6; }
    .boxMuted { fill: none; stroke: #9BB0C4; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .flow { fill: none; stroke: #FFFFFF; stroke-width: 1.6; marker-end: url(#arrow); }
    .flowMuted { fill: none; stroke: #9BB0C4; stroke-width: 1.4; stroke-dasharray: 6 5; marker-end: url(#arrowMuted); }
    .track { fill: none; stroke: #9BB0C4; stroke-width: 2; }
  </style>
  
  <text class="title" x="520" y="34" text-anchor="middle">Type mapping across three stages</text>
  <rect class="box" x="36" y="72" width="196" height="96" rx="12"/><text class="h" x="134" y="104" text-anchor="middle">Receiver type</text><text class="mono" x="134" y="128" text-anchor="middle">long</text>
  <rect class="box" x="288" y="72" width="196" height="96" rx="12"/><text class="h" x="386" y="104" text-anchor="middle">Interface metadata</text><text class="mono" x="386" y="128" text-anchor="middle">64-bit integer</text>
  <rect class="box" x="540" y="72" width="196" height="96" rx="12"/><text class="h" x="638" y="110" text-anchor="middle">Target generator</text><text class="small" x="638" y="132" text-anchor="middle">per Caller ecosystem</text>
  <rect class="box" x="792" y="72" width="212" height="96" rx="12"/><text class="h" x="898" y="104" text-anchor="middle">Caller type</text><text class="mono" x="898" y="128" text-anchor="middle">number</text>
  <path class="flow" d="M232 120 H288"/><path class="flow" d="M484 120 H540"/><path class="flow" d="M736 120 H792"/>
  <rect class="box" x="540" y="214" width="464" height="66" rx="12"/><text class="cap" x="560" y="240" text-anchor="start">NOT PORTABLE</text><text class="h" x="560" y="260" text-anchor="start">Framework complex type → rejected at generation</text>
  <path class="flowMuted" d="M638 168 V214"/>
  <text class="small" x="230" y="248" text-anchor="middle">Every stage must support the type</text>

</svg>
