<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 310" role="img" aria-labelledby="title desc">
  <title id="title">Type mapping across the provider, UGM, and target generator</title>
  <desc id="desc">A provider public type becomes a UGM type category, which the target code generator maps to a consumer type. Support is a property of the whole path: framework complex types can be rejected during package generation.</desc>
  <style>
    text{font:16px system-ui,sans-serif;fill:#171317}
    .h{font-weight:700;font-size:16px}
    .small{font-size:12.5px;fill:#706A70}
    .mono{font-family:'Courier New',monospace;font-size:15px;fill:#171317;font-weight:700}
    .card{fill:#ffffff;stroke:#E6E2E6;stroke-width:1.5}
    .flow{stroke:#171317;stroke-width:2.2;fill:none}
    .stopFlow{stroke:#8A641F;stroke-width:2.2;fill:none;stroke-dasharray:6 5}
    .ugmMono{font-family:'Courier New',monospace;font-size:15px;fill:#ffffff;font-weight:700}
    .ugmH{fill:#ffffff;font-weight:700;font-size:16px}
    .stopTag{font-size:11px;font-weight:700;letter-spacing:.05em;fill:#8A641F}
  </style>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DA1A60"/><stop offset="1" stop-color="#A8228D"/></linearGradient>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0l9 4.5-9 4.5z" fill="#171317"/></marker>
    <marker id="w" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0l9 4.5-9 4.5z" fill="#8A641F"/></marker>
    <filter id="s" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#171317" flood-opacity="0.10"/></filter>
    <filter id="g" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#A8228D" flood-opacity="0.28"/></filter>
  </defs>

  <rect x="8" y="8" width="1024" height="294" rx="20" fill="#FAF9FA"/>

  <g filter="url(#s)"><rect class="card" x="36" y="70" width="196" height="96" rx="14"/></g>
  <text class="h" x="134" y="102" text-anchor="middle">Provider type</text>
  <text class="mono" x="134" y="128" text-anchor="middle">long</text>
  <text class="small" x="134" y="150" text-anchor="middle">public signature</text>

  <g filter="url(#g)"><rect x="288" y="70" width="196" height="96" rx="14" fill="url(#brand)"/></g>
  <text class="ugmH" x="386" y="102" text-anchor="middle">UGM category</text>
  <text class="ugmMono" x="386" y="128" text-anchor="middle">64-bit integer</text>
  <text class="ugmH" x="386" y="150" text-anchor="middle" font-size="12" opacity=".9">language-neutral</text>

  <g filter="url(#s)"><rect class="card" x="540" y="70" width="196" height="96" rx="14"/></g>
  <text class="h" x="638" y="106" text-anchor="middle">Target generator</text>
  <text class="small" x="638" y="130" text-anchor="middle">per consumer</text>
  <text class="small" x="638" y="148" text-anchor="middle">ecosystem</text>

  <g filter="url(#s)"><rect class="card" x="792" y="70" width="212" height="96" rx="14"/></g>
  <text class="h" x="898" y="102" text-anchor="middle">Consumer type</text>
  <text class="mono" x="898" y="128" text-anchor="middle">number</text>
  <text class="small" x="898" y="150" text-anchor="middle">precision caveat</text>

  <path class="flow" marker-end="url(#a)" d="M232 118h56M484 118h56M736 118h56"/>

  <g filter="url(#s)"><rect class="card" x="540" y="212" width="464" height="66" rx="14" stroke="#8A641F"/></g>
  <text class="stopTag" x="560" y="238">NOT PORTABLE</text>
  <text class="h" x="560" y="258">Framework complex type &#8594; rejected at generation</text>
  <text class="small" x="560" y="274">for example a framework date/time type — use ISO-8601 strings instead</text>
  <path class="stopFlow" marker-end="url(#w)" d="M638 166v46"/>

  <text class="h" x="230" y="230" text-anchor="middle" font-size="15">Support depends on the whole</text>
  <text class="h" x="230" y="250" text-anchor="middle" font-size="15">provider &#8594; UGM &#8594; generator path,</text>
  <text class="h" x="230" y="270" text-anchor="middle" font-size="15">not the source language alone.</text>

  <text class="h" x="400" y="46" font-size="19">One type crosses three stages — every stage must support it</text>
</svg>
